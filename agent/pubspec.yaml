name: monitor_agent
description: Hidden employee monitoring agent (screenshots, activity, live screen share).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  window_manager: ^0.4.3
  launch_at_startup: ^0.3.1
  screen_capturer: ^0.2.3
  win32: ^5.5.4
  ffi: ^2.1.3
  image: ^4.2.0
  socket_io_client: ^2.0.3+1
  dio: ^5.7.0
  flutter_webrtc: ^0.11.7
  device_info_plus: ^11.1.0
  package_info_plus: ^8.1.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
